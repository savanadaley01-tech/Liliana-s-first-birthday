<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liliana's Fairy First Birthday Invitation</title>
    <style>
        :root {
            --purple-dark: #b19ffb;
            --purple-light: #c7bbfd;
            --purple-bg: #eadeff;
            --sage-green: #b2c9b3;
            --sage-green-hover: #9fb8a0;
            --star-color: #fff6cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--purple-bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Ambient floating background stars */
        .ambient-stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            cursor: pointer;
            margin-top: 140px; /* Space for the vertical card to rise */
        }

        /* Envelope Base Structure */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            background-color: var(--purple-dark);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 10px 30px rgba(93, 83, 106, 0.2);
        }

        /* Front pocket flaps using clip-path */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            z-index: 5; /* Sits in front of the hidden card */
            width: 100%;
            height: 100%;
            background-color: var(--purple-light);
            clip-path: polygon(0 30%, 50% 65%, 100% 30%, 100% 100%, 0 100%);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        /* Top Flap */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--purple-dark);
            clip-path: polygon(0 0, 50% 66%, 100% 0);
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.6s;
            z-index: 6; /* Covers everything when closed */
        }

        /* The Custom Image Invitation Card - Hidden by default inside the pocket */
        .card {
            position: absolute;
            top: 10px;
            left: 15px;
            width: 290px;
            height: 410px;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s, z-index 0.7s;
            z-index: 3; /* Behind front flaps and top flap */
            overflow: hidden;
            transform: translateY(0);
            opacity: 0; /* Fully invisible until envelope opens */
            pointer-events: none;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sage Green Heart Seal */
        .heart-seal {
            position: absolute;
            top: 58%;
            left: 50%;
            width: 42px;
            height: 42px;
            background-color: var(--sage-green);
            transform: translate(-50%, -30%) rotate(-45deg);
            transition: transform 0.5s ease, background-color 0.3s ease, opacity 0.4s;
            z-index: 7; /* On the very top layer to lock the flap */
            box-shadow: -2px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .heart-seal::before,
        .heart-seal::after {
            content: '';
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: var(--sage-green);
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .heart-seal::before {
            top: -21px;
            left: 0;
        }

        .heart-seal::after {
            left: 21px;
            top: 0;
        }

        .container:hover .heart-seal {
            background-color: var(--sage-green-hover);
        }
        .container:hover .heart-seal::before,
        .container:hover .heart-seal::after {
            background-color: var(--sage-green-hover);
        }

        /* 4-Point Diamond Star Ambient Styling */
        .diamond-star {
            position: absolute;
            background-color: var(--star-color);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            pointer-events: none;
        }

        /* Open State Transitions */
        .container.open .flap {
            transform: rotateX(180deg);
            z-index: 2; /* Drops behind the back of the envelope base */
        }

        /* Slides the hidden invite upward out of the pocket and brings it to the absolute front */
        .container.open .card {
            transform: translateY(-260px);
            opacity: 1; /* Reveals the invite graphic */
            z-index: 8; /* Out front so it blocks out the background envelope layers */
            pointer-events: auto;
        }

        .container.open .heart-seal {
            transform: translate(-50%, -120px) rotate(-45deg) scale(0);
            opacity: 0;
        }

        /* Exploding Particle Stars */
        .particle-star {
            position: absolute;
            z-index: 9;
            background-color: var(--star-color);
            clip-path: polygon(50% 0%, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0% 50%, 37% 37%);
            pointer-events: none;
            animation: explode 0.85s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--scale)) rotate(var(--rot));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-stars" id="ambientStars"></div>

    <div class="container" id="envelopeContainer">
        <div class="envelope-wrapper">
            <div class="flap"></div>
            <div class="card">
                <img src="https://i.postimg.cc/T3XbxwdC/Liliana-s-fairy-first-birthday-1.png" alt="Liliana's Fairy First Birthday Invitation">
            </div>
            <div class="heart-seal"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('envelopeContainer');
        const ambientContainer = document.getElementById('ambientStars');

        // Create ambient floating background stars
        function createAmbientStars() {
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.classList.add('diamond-star');
                
                const size = Math.random() * 14 + 10;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = Math.random() * 0.35 + 0.15;
                
                star.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                ambientContainer.appendChild(star);
            }
        }

        // Create the rapid explosion burst of 4-point diamond stars
        function createExplosion() {
            const rect = container.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;

            const particleCount = 50; 

            for (let i = 0; i < particleCount; i++) {
                const star = document.createElement('div');
                star.classList.add('particle-star');

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 220 + 70;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance - 50; 

                const size = Math.random() * 18 + 7;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${originX}px`;
                star.style.top = `${originY}px`;

                star.style.setProperty('--x', `${x}px`);
                star.style.setProperty('--y', `${y}px`);
                star.style.setProperty('--scale', Math.random() * 1.1 + 0.4);
                star.style.setProperty('--rot', `${Math.random() * 360}deg`);

                document.body.appendChild(star);

                star.addEventListener('animationend', () => {
                    star.remove();
                });
            }
        }

        // Toggle state handlers
        container.addEventListener('click', (e) => {
            if (!container.classList.contains('open')) {
                container.classList.add('open');
                createExplosion();
            } else {
                container.classList.remove('open');
            }
        });

        // Initialize elements
        createAmbientStars();
    </script>
</body>
</html>
